<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Aplicativo oficial da Pelada 4k" />

    <!-- iOS: instalar como app de tela inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pelada" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>PELADA 4K - Oficial</title>

    <!-- Preview de link (WhatsApp, iMessage, Telegram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PELADA 4K - Oficial" />
    <meta property="og:title" content="PELADA 4K - Oficial" />
    <meta property="og:description" content="Aplicativo oficial da Pelada 4k" />
    <meta property="og:image" content="https://www.pelada4k.com.br/assets/logo.png" />
    <meta property="og:url" content="https://www.pelada4k.com.br/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PELADA 4K - Oficial" />
    <meta name="twitter:description" content="Aplicativo oficial da Pelada 4k" />
    <meta name="twitter:image" content="https://www.pelada4k.com.br/assets/logo.png" />

    <style>
      html, body { margin: 0; padding: 0; min-height: 100%; background: #0a0908; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Tela de carregamento exibida antes do React montar */
      #boot-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; background: #0a0908; z-index: 9999;
      }
      #boot-loader img { width: 72px; height: 72px; opacity: 0.9; animation: boot-pulse 1.4s ease-in-out infinite; }
      #boot-loader span { font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: 2px; color: #948c7e; text-transform: uppercase; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <noscript>
      Este app precisa de JavaScript habilitado no navegador para funcionar.
    </noscript>

    <div id="boot-loader">
      <img src="/assets/logo.png" alt="" />
      <span>Carregando…</span>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove a tela de carregamento assim que o React montar o conteúdo real
      window.addEventListener("DOMContentLoaded", () => {
        const check = setInterval(() => {
          const root = document.getElementById("root");
          if (root && root.children.length > 0) {
            const loader = document.getElementById("boot-loader");
            if (loader) loader.remove();
            clearInterval(check);
          }
        }, 80);
      });
    </script>
  </body>
</html>
